<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports & Analytics</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* ================================
           REPORT PAGE BACKGROUND
        ================================= */

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(0, 200, 255, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(120, 60, 255, 0.30),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #172554,
                    #1e1b4b
                );

            overflow-x: hidden;
        }


        /* ================================
           GLOWING BACKGROUND
        ================================= */

        body::before {
            content: "";
            position: fixed;

            width: 400px;
            height: 400px;

            background: rgba(0, 200, 255, 0.15);

            filter: blur(100px);

            top: 5%;
            left: 5%;

            animation: glowOne 8s infinite alternate;

            z-index: -1;
        }


        body::after {
            content: "";
            position: fixed;

            width: 350px;
            height: 350px;

            background: rgba(100, 50, 255, 0.20);

            filter: blur(100px);

            bottom: 5%;
            right: 5%;

            animation: glowTwo 10s infinite alternate;

            z-index: -1;
        }


        @keyframes glowOne {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(120px, 80px);
            }

        }


        @keyframes glowTwo {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-100px, -70px);
            }

        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .report-container {

            max-width: 950px;

            margin: 70px auto;

            padding: 45px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45);

            animation: fadeUp 0.8s ease;

        }


        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ================================
           HEADING
        ================================= */

        .report-title {

            text-align: center;

            font-size: 38px;

            font-weight: 700;

            margin-bottom: 10px;

            background:
                linear-gradient(
                    90deg,
                    #22d3ee,
                    #60a5fa,
                    #a78bfa
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        .report-subtitle {

            text-align: center;

            color: #cbd5e1;

            margin-bottom: 35px;

            font-size: 16px;

        }


        /* ================================
           REPORT TABLE
        ================================= */

        .report-table {

            overflow: hidden;

            border-radius: 15px;

            border: 1px solid rgba(255, 255, 255, 0.12);

        }


        .table {

            margin-bottom: 0;

            color: white;

        }


        .table th {

            background: rgba(37, 99, 235, 0.35);

            color: #e0f2fe;

            font-weight: 600;

            padding: 20px;

            border-color: rgba(255, 255, 255, 0.1);

        }


        .table td {

            background: rgba(255, 255, 255, 0.06);

            color: #f8fafc;

            padding: 20px;

            border-color: rgba(255, 255, 255, 0.1);

            font-size: 17px;

        }


        .table tr:hover td {

            background: rgba(34, 211, 238, 0.10);

            transition: 0.3s;

        }


        /* ================================
           STATUS COLORS
        ================================= */

        .healthy {

            color: #4ade80 !important;

            font-weight: 700;

        }


        .critical {

            color: #fb7185 !important;

            font-weight: 700;

        }


        .pending {

            color: #facc15 !important;

            font-weight: 700;

        }


        /* ================================
           DASHBOARD BUTTON
        ================================= */

        .dashboard-button {

            display: block;

            width: fit-content;

            margin: 35px auto 0;

            padding: 12px 35px;

            border-radius: 30px;

            border: none;

            color: white;

            text-decoration: none;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #2563eb
                );

            box-shadow:
                0 8px 25px rgba(37, 99, 235, 0.35);

            transition: 0.3s ease;

        }


        .dashboard-button:hover {

            transform: translateY(-3px);

            color: white;

            box-shadow:
                0 12px 30px rgba(34, 211, 238, 0.5);

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 768px) {

            .report-container {

                margin: 30px 15px;

                padding: 25px;

            }


            .report-title {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


    <div class="container">

        <div class="report-container">


            <h2 class="report-title">

                📊 Reports & Analytics

            </h2>


            <p class="report-subtitle">

                AI Heritage Preservation System — Monument Health Overview

            </p>


            <div class="report-table">

                <table class="table table-bordered">

                    <tr>

                        <th>
                            Total Monuments
                        </th>

                        <td>
                            320
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Healthy
                        </th>

                        <td class="healthy">
                            280
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Critical
                        </th>

                        <td class="critical">
                            18
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Pending Reports
                        </th>

                        <td class="pending">
                            12
                        </td>

                    </tr>

                </table>

            </div>


            <a
                href="/dashboard"
                class="dashboard-button"
            >

                ← Back to Dashboard

            </a>


        </div>

    </div>


</body>

</html>
