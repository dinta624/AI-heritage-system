<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Heritage Login</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Your CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        /* =========================================
           LOGIN BACKGROUND
        ========================================== */

        body {

            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 10% 15%,
                    rgba(34, 211, 238, 0.30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 85%,
                    rgba(37, 99, 235, 0.35),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #020617 0%,
                    #0f172a 50%,
                    #172554 100%
                );
        }


        /* =========================================
           ANIMATED GLOW
        ========================================== */

        .glow {

            position: fixed;

            border-radius: 50%;

            filter: blur(100px);

            pointer-events: none;

            z-index: 0;
        }


        .glow-one {

            width: 350px;

            height: 350px;

            background: rgba(34, 211, 238, 0.20);

            top: -120px;

            left: -100px;

            animation:
                moveGlowOne 8s ease-in-out infinite alternate;
        }


        .glow-two {

            width: 400px;

            height: 400px;

            background: rgba(37, 99, 235, 0.22);

            bottom: -150px;

            right: -120px;

            animation:
                moveGlowTwo 10s ease-in-out infinite alternate;
        }


        @keyframes moveGlowOne {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(120px, 80px);
            }
        }


        @keyframes moveGlowTwo {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-100px, -80px);
            }
        }


        /* =========================================
           LOGIN CARD
        ========================================== */

        .login-card {

            position: relative;

            z-index: 2;

            width: 430px;

            padding: 45px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:

                0 25px 70px rgba(0, 0, 0, 0.55),

                0 0 45px rgba(34, 211, 238, 0.15);

            animation: cardAppear 0.8s ease;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.95);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           HERITAGE ICON
        ========================================== */

        .login-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            font-size: 36px;

            background:

                linear-gradient(
                    135deg,
                    #06b6d4,
                    #2563eb
                );

            box-shadow:

                0 0 30px
                rgba(34, 211, 238, 0.45);
        }


        /* =========================================
           TITLE
        ========================================== */

        .login-title {

            text-align: center;

            color: #22d3ee;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .login-subtitle {

            text-align: center;

            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================================
           FORM
        ========================================== */

        .login-field {

            margin-bottom: 20px;
        }


        .login-field label {

            display: block;

            color: #f8fafc;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .login-field input {

            width: 100%;

            height: 50px;

            padding: 12px 15px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid
                rgba(255, 255, 255, 0.20);

            color: white;

            outline: none;

            transition: 0.3s;
        }


        .login-field input::placeholder {

            color: #cbd5e1;
        }


        .login-field input:focus {

            background:
                rgba(255, 255, 255, 0.17);

            border-color: #22d3ee;

            color: white;

            box-shadow:

                0 0 18px
                rgba(34, 211, 238, 0.35);
        }


        /* =========================================
           LOGIN BUTTON
        ========================================== */

        .login-button {

            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: none;

            border-radius: 30px;

            background:

                linear-gradient(
                    135deg,
                    #06b6d4,
                    #2563eb
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:

                0 8px 25px
                rgba(37, 99, 235, 0.30);
        }


        .login-button:hover {

            transform: translateY(-3px);

            box-shadow:

                0 0 30px
                rgba(34, 211, 238, 0.65);
        }


        /* =========================================
           FOOTER
        ========================================== */

        .login-footer {

            text-align: center;

            color: #94a3b8;

            font-size: 11px;

            margin-top: 25px;

            margin-bottom: 0;
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 500px) {

            body {

                padding: 15px;

                overflow-y: auto;
            }


            .login-card {

                width: 100%;

                padding: 35px 25px;
            }


            .login-title {

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         ANIMATED BACKGROUND
    ========================================== -->

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>


    <!-- =========================================
         LOGIN CARD
    ========================================== -->

    <div class="login-card">


        <!-- Heritage Icon -->

        <div class="login-icon">

            🏛️

        </div>


        <!-- Title -->

        <h1 class="login-title">

            AI Heritage Login

        </h1>


        <p class="login-subtitle">

            Smart Heritage Preservation System

        </p>


        <!-- Login Form -->

        <form action="/dashboard" method="GET">


            <!-- Username -->

            <div class="login-field">

                <label for="username">

                    Username

                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="login-field">

                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Login -->

            <button
                type="submit"
                class="login-button"
            >

                🔐 Login

            </button>


        </form>


        <!-- Footer -->

        <p class="login-footer">

            🛡 Secure & Trusted
            &nbsp; | &nbsp;
            🤖 AI-Powered Monitoring
            &nbsp; | &nbsp;
            🏛️ Preserve Heritage

        </p>


    </div>


</body>

</html>
