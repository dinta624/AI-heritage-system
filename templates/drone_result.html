<!DOCTYPE html>
<html>

<head>

<title>Drone Analysis Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>
🚁 Drone AI Analysis Result
</h2>



<div class="card p-4 mt-4">


<img 
src="{{ url_for('static', filename='uploads/drone/' + image) }}"
class="img-fluid"
width="400">



<hr>


<h4>
Damage Detection:
{{ damage }}
</h4>


<h4>
Confidence:
{{ confidence }}
</h4>


<h4>
Risk Level:
{{ risk }}
</h4>



<a href="/maintenance" class="btn btn-success">

🛠 Maintenance Recommendation

</a>



</div>


</div>


</body>

</html>
