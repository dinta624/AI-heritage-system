<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Heritage Visualization</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #173f69, transparent 35%),
                radial-gradient(circle at bottom right, #062d50, transparent 40%),
                linear-gradient(135deg, #061827, #0a2742, #061827);

            color: white;
        }

        .page {
            min-height: 100vh;
            padding: 35px 20px 50px;
        }

        .title {
            text-align: center;
            font-size: 38px;
            font-weight: 700;
            color: #00d9ff;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.35);
        }

        .subtitle {
            text-align: center;
            color: #d8e7f3;
            font-size: 17px;
            margin-bottom: 28px;
        }

        .selector-box {
            max-width: 430px;
            margin: 0 auto 25px;
        }

        .selector-box select {
            width: 100%;
            padding: 15px 18px;
            border-radius: 30px;
            border: 1px solid rgba(0, 217, 255, 0.5);

            background: rgba(18, 55, 83, 0.95);
            color: white;

            font-size: 16px;
            outline: none;
            cursor: pointer;
        }

        .selector-box select option {
            background: #123753;
            color: white;
        }

        .viewer {
            width: 100%;
            max-width: 1250px;
            height: 550px;

            margin: auto;

            border-radius: 25px;

            background:
                radial-gradient(circle at center,
                    rgba(46, 105, 151, 0.65),
                    rgba(4, 21, 36, 0.98));

            border: 1px solid rgba(106, 210, 255, 0.35);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                inset 0 0 40px rgba(0, 200, 255, 0.08);

            overflow: hidden;
            position: relative;
        }

        #three-container {
            width: 100%;
            height: 100%;
        }

        .monument-info {
            max-width: 800px;
            margin: 25px auto 0;

            padding: 22px 28px;

            border-radius: 20px;

            background: rgba(17, 54, 81, 0.85);

            border: 1px solid rgba(92, 211, 255, 0.25);

            text-align: center;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .monument-info h2 {
            color: #00d9ff;
            margin-bottom: 10px;
        }

        .monument-info p {
            color: #dcebf5;
            margin: 5px;
        }

        .controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);

            padding: 8px 16px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.45);

            color: #d9f7ff;

            font-size: 13px;
            z-index: 10;
        }

        .back-button {
            display: block;
            width: fit-content;

            margin: 25px auto 0;

            padding: 11px 25px;

            border-radius: 25px;

            background: linear-gradient(135deg, #00cfff, #0077ff);

            color: white;
            text-decoration: none;
            font-weight: bold;

            transition: 0.3s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            color: white;
            box-shadow: 0 8px 25px rgba(0, 191, 255, 0.35);
        }

        @media(max-width: 768px) {

            .title {
                font-size: 28px;
            }

            .viewer {
                height: 430px;
            }

            .monument-info {
                margin-left: 10px;
                margin-right: 10px;
            }

        }

    </style>
</head>


<body>

<div class="page">

    <h1 class="title">
        🏛️ 3D Heritage Visualization
    </h1>

    <p class="subtitle">
        Explore Indian Heritage Monuments in Interactive 3D
    </p>


    <!-- Monument Selection -->

    <div class="selector-box">

        <select id="monumentSelect">

            <option value="taj">Taj Mahal</option>

            <option value="redfort">Red Fort</option>

            <option value="qutub">Qutub Minar</option>

            <option value="konark">Konark Sun Temple</option>

            <option value="brihadeeswara">Brihadeeswarar Temple</option>

            <option value="mysore">Mysore Palace</option>

            <option value="hampi">Hampi</option>

            <option value="gateway">Gateway of India</option>

            <option value="sanchi">Sanchi Stupa</option>

            <option value="charminar">Charminar</option>

        </select>

    </div>


    <!-- 3D Viewer -->

    <div class="viewer">

        <div id="three-container"></div>

        <div class="controls">
            🖱️ Drag to Rotate &nbsp; | &nbsp;
            🔍 Scroll to Zoom
        </div>

    </div>


    <!-- Information -->

    <div class="monument-info">

        <h2 id="monumentName">
            Taj Mahal
        </h2>

        <p id="monumentLocation">
            📍 Agra, Uttar Pradesh
        </p>

        <p id="monumentDescription">
            Famous Mughal monument built with white marble.
        </p>

    </div>


    <a href="/dashboard" class="back-button">
        ← Back to Dashboard
    </a>

</div>


<script>

    /* =====================================================
       THREE.JS SETUP
    ===================================================== */

    const container = document.getElementById("three-container");

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x071c2e);


    const camera = new THREE.PerspectiveCamera(
        45,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
    );

    camera.position.set(9, 6, 12);


    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.shadowMap.enabled = true;

    container.appendChild(renderer.domElement);


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambientLight = new THREE.AmbientLight(
        0xffffff,
        2
    );

    scene.add(ambientLight);


    const mainLight = new THREE.DirectionalLight(
        0xffffff,
        4
    );

    mainLight.position.set(8, 12, 10);

    mainLight.castShadow = true;

    scene.add(mainLight);


    const blueLight = new THREE.PointLight(
        0x00cfff,
        35,
        50
    );

    blueLight.position.set(
        -8,
        5,
        5
    );

    scene.add(blueLight);


    /* =====================================================
       GROUND
    ===================================================== */

    const groundGeometry =
        new THREE.CylinderGeometry(
            6,
            6,
            0.3,
            64
        );

    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x163c5c,
            metalness: 0.3,
            roughness: 0.7
        });

    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.position.y = -2;

    ground.receiveShadow = true;

    scene.add(ground);


    /* =====================================================
       MONUMENT GROUP
    ===================================================== */

    let monumentGroup = new THREE.Group();

    scene.add(monumentGroup);


    /* =====================================================
       MATERIALS
    ===================================================== */

    const whiteMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xf1eee5,
            roughness: 0.55
        });


    const redMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x9d3b25,
            roughness: 0.65
        });


    const sandstoneMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xb87942,
            roughness: 0.75
        });


    const goldMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xd7a62a,
            metalness: 0.65,
            roughness: 0.3
        });


    const darkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x574133,
            roughness: 0.8
        });


    /* =====================================================
       HELPER FUNCTIONS
    ===================================================== */

    function box(
        x,
        y,
        z,
        width,
        height,
        depth,
        material
    ) {

        const geometry =
            new THREE.BoxGeometry(
                width,
                height,
                depth
            );

        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );

        mesh.position.set(
            x,
            y,
            z
        );

        mesh.castShadow = true;

        mesh.receiveShadow = true;

        monumentGroup.add(mesh);

        return mesh;
    }


    function cylinder(
        x,
        y,
        z,
        radius,
        height,
        material,
        segments = 32
    ) {

        const geometry =
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                segments
            );

        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );

        mesh.position.set(
            x,
            y,
            z
        );

        mesh.castShadow = true;

        monumentGroup.add(mesh);

        return mesh;
    }


    function cone(
        x,
        y,
        z,
        radius,
        height,
        material
    ) {

        const geometry =
            new THREE.ConeGeometry(
                radius,
                height,
                32
            );

        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );

        mesh.position.set(
            x,
            y,
            z
        );

        mesh.castShadow = true;

        monumentGroup.add(mesh);

        return mesh;
    }


    function dome(
        x,
        y,
        z,
        radius,
        material
    ) {

        const geometry =
            new THREE.SphereGeometry(
                radius,
                32,
                16,
                0,
                Math.PI * 2,
                0,
                Math.PI / 2
            );

        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );

        mesh.position.set(
            x,
            y,
            z
        );

        mesh.castShadow = true;

        monumentGroup.add(mesh);

        return mesh;
    }


    function tower(
        x,
        y,
        z,
        radius,
        height,
        material
    ) {

        cylinder(
            x,
            y,
            z,
            radius,
            height,
            material,
            32
        );

        cone(
            x,
            y + height / 2 + 0.5,
            z,
            radius * 1.3,
            1,
            material
        );

    }


    /* =====================================================
       TAJ MAHAL
    ===================================================== */

    function createTajMahal() {

        box(
            0,
            0,
            0,
            7,
            2.8,
            5,
            whiteMaterial
        );

        box(
            0,
            1.8,
            0,
            4.5,
            1.2,
            3.5,
            whiteMaterial
        );

        dome(
            0,
            3,
            0,
            1.8,
            whiteMaterial
        );

        cone(
            0,
            4.3,
            0,
            0.35,
            1.2,
            goldMaterial
        );

        tower(-3.5, 1.8, -2.2, 0.35, 4, whiteMaterial);
        tower(3.5, 1.8, -2.2, 0.35, 4, whiteMaterial);
        tower(-3.5, 1.8, 2.2, 0.35, 4, whiteMaterial);
        tower(3.5, 1.8, 2.2, 0.35, 4, whiteMaterial);

    }


    /* =====================================================
       RED FORT
    ===================================================== */

    function createRedFort() {

        box(
            0,
            0,
            0,
            8,
            3,
            5,
            redMaterial
        );

        box(
            0,
            2.5,
            -2.3,
            8,
            2,
            0.7,
            redMaterial
        );

        tower(-3.7, 2.2, -2.1, 0.65, 4, redMaterial);
        tower(3.7, 2.2, -2.1, 0.65, 4, redMaterial);

        box(
            0,
            1,
            -2.7,
            2,
            2,
            0.5,
            darkMaterial
        );

    }


    /* =====================================================
       QUTUB MINAR
    ===================================================== */

    function createQutub() {

        cylinder(
            0,
            2,
            0,
            1.1,
            6,
            sandstoneMaterial,
            32
        );

        cylinder(
            0,
            5.5,
            0,
            0.8,
            1,
            sandstoneMaterial
        );

        cylinder(
            0,
            6.3,
            0,
            0.6,
            0.7,
            sandstoneMaterial
        );

        cone(
            0,
            7.1,
            0,
            0.7,
            1.4,
            sandstoneMaterial
        );

    }


    /* =====================================================
       KONARK SUN TEMPLE
    ===================================================== */

    function createKonark() {

        box(
            0,
            0,
            0,
            7,
            3,
            5,
            sandstoneMaterial
        );

        cone(
            0,
            4,
            0,
            2.6,
            4,
            sandstoneMaterial
        );

        cylinder(
            -3.2,
            -0.3,
            2.7,
            1,
            0.4,
            sandstoneMaterial,
            32
        );

        cylinder(
            3.2,
            -0.3,
            2.7,
            1,
            0.4,
            sandstoneMaterial,
            32
        );

    }


    /* =====================================================
       BRIHADEESWARAR TEMPLE
    ===================================================== */

    function createBrihadeeswara() {

        box(
            0,
            0,
            0,
            6,
            2,
            5,
            sandstoneMaterial
        );

        cone(
            0,
            4,
            0,
            2.8,
            5,
            sandstoneMaterial
        );

        cone(
            0,
            6.5,
            0,
            1,
            1.2,
            goldMaterial
        );

    }


    /* =====================================================
       MYSORE PALACE
    ===================================================== */

    function createMysore() {

        box(
            0,
            0,
            0,
            8,
            2.8,
            4.5,
            goldMaterial
        );

        tower(
            -3,
            2,
            -1.5,
            0.65,
            4,
            goldMaterial
        );

        tower(
            3,
            2,
            -1.5,
            0.65,
            4,
            goldMaterial
        );

        tower(
            -3,
            2,
            1.5,
            0.65,
            4,
            goldMaterial
        );

        tower(
            3,
            2,
            1.5,
            0.65,
            4,
            goldMaterial
        );

        dome(
            0,
            3.3,
            0,
            1.4,
            goldMaterial
        );

    }


    /* =====================================================
       HAMPI
    ===================================================== */

    function createHampi() {

        box(
            0,
            0,
            0,
            5,
            2,
            4,
            sandstoneMaterial
        );

        tower(
            0,
            2.5,
            0,
            1,
            5,
            sandstoneMaterial
        );

        cone(
            0,
            5.5,
            0,
            1.5,
            1.5,
            sandstoneMaterial
        );

        box(
            -3,
            0,
            2,
            2,
            2,
            2,
            darkMaterial
        );

        box(
            3,
            0,
            2,
            2,
            2,
            2,
            darkMaterial
        );

    }


    /* =====================================================
       GATEWAY OF INDIA
    ===================================================== */

    function createGateway() {

        box(
            0,
            0,
            0,
            6,
            5,
            2,
            sandstoneMaterial
        );

        box(
            0,
            0.5,
            -1.1,
            2.2,
            3.5,
            0.5,
            darkMaterial
        );

        cylinder(
            -2.1,
            3,
            0,
            0.7,
            2,
            sandstoneMaterial
        );

        cylinder(
            2.1,
            3,
            0,
            0.7,
            2,
            sandstoneMaterial
        );

        dome(
            0,
            3.2,
            0,
            1.1,
            sandstoneMaterial
        );

    }


    /* =====================================================
       SANCHI STUPA
    ===================================================== */

    function createSanchi() {

        cylinder(
            0,
            0.5,
            0,
            3.2,
            1,
            sandstoneMaterial,
            64
        );

        const sphere =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    2.7,
                    64,
                    32,
                    0,
                    Math.PI * 2,
                    0,
                    Math.PI / 2
                ),
                sandstoneMaterial
            );

        sphere.position.y = 0.8;

        monumentGroup.add(sphere);

        box(
            0,
            3,
            0,
            0.4,
            2,
            0.4,
            sandstoneMaterial
        );

        box(
            0,
            4,
            0,
            2,
            0.3,
            0.5,
            sandstoneMaterial
        );

    }


    /* =====================================================
       CHARMINAR
    ===================================================== */

    function createCharminar() {

        box(
            0,
            0,
            0,
            5,
            3,
            5,
            sandstoneMaterial
        );

        box(
            0,
            1,
            -2.6,
            2,
            2,
            0.4,
            darkMaterial
        );

        tower(-2, 3, -2, 0.6, 5, sandstoneMaterial);
        tower(2, 3, -2, 0.6, 5, sandstoneMaterial);
        tower(-2, 3, 2, 0.6, 5, sandstoneMaterial);
        tower(2, 3, 2, 0.6, 5, sandstoneMaterial);

    }


    /* =====================================================
       MONUMENT DATA
    ===================================================== */

    const monumentData = {

        taj: {
            name: "Taj Mahal",
            location: "📍 Agra, Uttar Pradesh",
            description:
                "Famous Mughal monument built with white marble.",
            create: createTajMahal
        },

        redfort: {
            name: "Red Fort",
            location: "📍 Delhi, India",
            description:
                "Historic Mughal fort built using red sandstone.",
            create: createRedFort
        },

        qutub: {
            name: "Qutub Minar",
            location: "📍 Delhi, India",
            description:
                "Historic stone minaret and UNESCO World Heritage Site.",
            create: createQutub
        },

        konark: {
            name: "Konark Sun Temple",
            location: "📍 Konark, Odisha",
            description:
                "Ancient temple famous for its magnificent stone architecture.",
            create: createKonark
        },

        brihadeeswara: {
            name: "Brihadeeswarar Temple",
            location: "📍 Thanjavur, Tamil Nadu",
            description:
                "Magnificent Chola-era temple dedicated to Lord Shiva.",
            create: createBrihadeeswara
        },

        mysore: {
            name: "Mysore Palace",
            location: "📍 Mysore, Karnataka",
            description:
                "Grand royal palace famous for Indo-Saracenic architecture.",
            create: createMysore
        },

        hampi: {
            name: "Hampi",
            location: "📍 Vijayanagara, Karnataka",
            description:
                "Historic ruins of the Vijayanagara Empire.",
            create: createHampi
        },

        gateway: {
            name: "Gateway of India",
            location: "📍 Mumbai, Maharashtra",
            description:
                "Iconic monument overlooking the Arabian Sea.",
            create: createGateway
        },

        sanchi: {
            name: "Sanchi Stupa",
            location: "📍 Sanchi, Madhya Pradesh",
            description:
                "Ancient Buddhist monument and UNESCO World Heritage Site.",
            create: createSanchi
        },

        charminar: {
            name: "Charminar",
            location: "📍 Hyderabad, Telangana",
            description:
                "Iconic four-minaret monument located in the heart of Hyderabad.",
            create: createCharminar
        }

    };


    /* =====================================================
       LOAD MONUMENT
    ===================================================== */

    function loadMonument(type) {

        /* Remove old model */

        scene.remove(monumentGroup);

        monumentGroup =
            new THREE.Group();

        scene.add(monumentGroup);


        /* Create selected monument */

        monumentData[type].create();


        /* Update information */

        document.getElementById(
            "monumentName"
        ).textContent =
            monumentData[type].name;


        document.getElementById(
            "monumentLocation"
        ).textContent =
            monumentData[type].location;


        document.getElementById(
            "monumentDescription"
        ).textContent =
            monumentData[type].description;


        /* Reset position */

        monumentGroup.rotation.set(
            0,
            0,
            0
        );

        monumentGroup.position.y = 0;

    }


    /* =====================================================
       SELECT EVENT
    ===================================================== */

    document
        .getElementById("monumentSelect")
        .addEventListener(
            "change",
            function () {

                loadMonument(
                    this.value
                );

            }
        );


    /* =====================================================
       MOUSE ROTATION
    ===================================================== */

    let dragging = false;

    let previousX = 0;
    let previousY = 0;


    renderer.domElement.addEventListener(
        "mousedown",
        function(event) {

            dragging = true;

            previousX = event.clientX;
            previousY = event.clientY;

        }
    );


    window.addEventListener(
        "mouseup",
        function() {

            dragging = false;

        }
    );


    window.addEventListener(
        "mousemove",
        function(event) {

            if (!dragging) return;

            const deltaX =
                event.clientX - previousX;

            const deltaY =
                event.clientY - previousY;


            monumentGroup.rotation.y +=
                deltaX * 0.01;

            monumentGroup.rotation.x +=
                deltaY * 0.005;


            previousX =
                event.clientX;

            previousY =
                event.clientY;

        }
    );


    /* =====================================================
       TOUCH ROTATION
    ===================================================== */

    let touchX = 0;


    renderer.domElement.addEventListener(
        "touchstart",
        function(event) {

            if (
                event.touches &&
                event.touches.length > 0
            ) {

                touchX =
                    event.touches[0].clientX;

            }

        }
    );


    renderer.domElement.addEventListener(
        "touchmove",
        function(event) {

            if (
                event.touches &&
                event.touches.length > 0
            ) {

                const currentX =
                    event.touches[0].clientX;

                const difference =
                    currentX - touchX;

                monumentGroup.rotation.y +=
                    difference * 0.01;

                touchX =
                    currentX;

            }

        }
    );


    /* =====================================================
       ZOOM
    ===================================================== */

    renderer.domElement.addEventListener(
        "wheel",
        function(event) {

            camera.position.z +=
                event.deltaY * 0.01;

            camera.position.z =
                Math.max(
                    7,
                    Math.min(
                        22,
                        camera.position.z
                    )
                );

        }
    );


    /* =====================================================
       ANIMATION
    ===================================================== */

    function animate() {

        requestAnimationFrame(
            animate
        );

        renderer.render(
            scene,
            camera
        );

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                container.clientWidth /
                container.clientHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                container.clientWidth,
                container.clientHeight
            );

        }
    );
