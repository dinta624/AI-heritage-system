<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heritage Site Map</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* ==============================
           MAIN BACKGROUND
        ============================== */

        body {

            margin: 0;

            min-height: 100vh;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(0, 255, 255, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(0, 120, 255, 0.30),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #1e3a5f
                );

            overflow-x: hidden;

        }


        /* ==============================
           GLOW EFFECT
        ============================== */

        body::before {

            content: "";

            position: fixed;

            width: 400px;

            height: 400px;

            background: rgba(0, 255, 255, 0.12);

            filter: blur(100px);

            top: 5%;

            left: 5%;

            animation: glowMove 8s infinite alternate;

            z-index: -1;

        }


        body::after {

            content: "";

            position: fixed;

            width: 350px;

            height: 350px;

            background: rgba(0, 100, 255, 0.18);

            filter: blur(100px);

            bottom: 5%;

            right: 5%;

            animation: glowMove2 10s infinite alternate;

            z-index: -1;

        }


        @keyframes glowMove {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(120px, 70px);
            }

        }


        @keyframes glowMove2 {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-100px, -60px);
            }

        }


        /* ==============================
           PAGE TITLE
        ============================== */

        .map-title {

            font-weight: 700;

            letter-spacing: 1px;

            background: linear-gradient(
                90deg,
                #22d3ee,
                #60a5fa
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        /* ==============================
           MAP CONTAINER
        ============================== */

        .map-box {

            background: rgba(255,255,255,0.10);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.18);

            border-radius: 22px;

            padding: 12px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.40);

        }


        /* ==============================
           GOOGLE MAP
        ============================== */

        .map-frame {

            width: 100%;

            height: 500px;

            border: 0;

            border-radius: 15px;

        }


        /* ==============================
           SITE CARDS
        ============================== */

        .site-card {

            background: rgba(255,255,255,0.10);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.18);

            border-radius: 20px;

            padding: 20px;

            color: white;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.30);

            transition: 0.3s ease;

        }


        .site-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 18px 40px rgba(0,0,0,0.45),
                0 0 20px rgba(34,211,238,0.15);

        }


        .site-card h4 {

            color: #67e8f9;

            font-weight: 700;

            margin-bottom: 15px;

        }


        .site-card p {

            color: #e2e8f0;

            margin-bottom: 8px;

        }


        /* ==============================
           STATUS COLORS
        ============================== */

        .healthy {

            color: #4ade80 !important;

            font-weight: 700;

        }


        .observation {

            color: #facc15 !important;

            font-weight: 700;

        }


        .critical {

            color: #fb7185 !important;

            font-weight: 700;

        }


        .health-score {

            color: #22d3ee !important;

            font-weight: 800;

        }


        /* ==============================
           ANIMATION
        ============================== */

        .content-animation {

            animation: fadeUp 0.8s ease;

        }


        @keyframes fadeUp {

            from {

                opacity: 0;

                transform: translateY(25px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 768px) {

            .map-frame {

                height: 400px;

            }

            .map-title {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


<div class="content-animation">


    <!-- ==============================
         PAGE TITLE
    ============================== -->

    <h2 class="text-center mt-4 map-title">

        🗺 Heritage Site Map

    </h2>



    <!-- ==============================
         GOOGLE MAP
    ============================== -->

    <div class="container mt-4">


        <div class="map-box">


            <iframe

                class="map-frame"

                src="https://www.google.com/maps?q=Taj+Mahal&output=embed"

                allowfullscreen>

            </iframe>


        </div>


    </div>



    <!-- ==============================
         HERITAGE SITES
    ============================== -->

    <div class="container mt-4 mb-5">


        <div class="row g-4">


            <!-- TAJ MAHAL -->

            <div class="col-lg-4">


                <div class="site-card">


                    <h4>

                        🏛 Taj Mahal

                    </h4>


                    <p>

                        Status :

                        <span class="healthy">

                            Healthy

                        </span>

                    </p>


                    <p>

                        Health Score :

                        <span class="health-score">

                            92%

                        </span>

                    </p>


                </div>


            </div>



            <!-- QUTUB MINAR -->

            <div class="col-lg-4">


                <div class="site-card">


                    <h4>

                        🏛 Qutub Minar

                    </h4>


                    <p>

                        Status :

                        <span class="observation">

                            Under Observation

                        </span>

                    </p>


                    <p>

                        Health Score :

                        <span class="health-score">

                            81%

                        </span>

                    </p>


                </div>


            </div>



            <!-- KONARK TEMPLE -->

            <div class="col-lg-4">


                <div class="site-card">


                    <h4>

                        🛕 Konark Temple

                    </h4>


                    <p>

                        Status :

                        <span class="critical">

                            Critical

                        </span>

                    </p>


                    <p>

                        Health Score :

                        <span class="health-score">

                            69%

                        </span>

                    </p>


                </div>


            </div>


        </div>


    </div>


</div>


</body>

</html>
